underline">+ SHIPPING_FEE_PER_KG: float = 2.50</text><text x="768.0" y="611.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">- weight: float</text><line x1="760" y1="624" x2="1212.3" y2="624" stroke="#222" stroke-width="1.4"/><text x="768.0" y="645.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ __init__(product_id, name, price, stock, weight: float)</text><text x="768.0" y="663.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ get_weight(): float</text><text x="768.0" y="681.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ display_information(): None</text><text x="768.0" y="699.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ get_fulfilment_info(): str</text><text x="768.0" y="717.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ calculate_shipping_cost(): float</text><text x="768.0" y="735.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ to_dict(): dict</text><text x="768.0" y="753.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start" text-decoration="underline">+ from_dict(data: dict): PhysicalProduct</text><polygon points="712.6,398 702.6,416 722.6,416" fill="#fff" stroke="#222" stroke-width="1.4"/><polyline points="712.6,416 712.6,470" fill="none" stroke="#222" stroke-width="1.4"/><polyline points="402.6,470 880.0,470" fill="none" stroke="#222" stroke-width="1.4"/><line x1="402.6" y1="470" x2="402.6" y2="520" stroke="#222" stroke-width="1.4"/><line x1="880.0" y1="470" x2="880.0" y2="520" stroke="#222" stroke-width="1.4"/><text x="726.6" y="446.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">inherits from</text><polygon points="1190.875,182 1180.875,200 1200.875,200" fill="#fff" stroke="#222" stroke-width="1.4"/><line x1="1190.9" y1="200" x2="1190.9" y2="520" stroke="#222" stroke-width="1.4" stroke-dasharray="8,6"/><text x="1200.9" y="360.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">implements</text><polygon points="359.1,140 371.1,133 383.1,140 371.1,147" fill="#fff" stroke="#222" stroke-width="1.4"/><line x1="383.1" y1="140" x2="460" y2="140" stroke="#222" stroke-width="1.4"/><text x="365.1" y="128.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">1</text><text x="454.0" y="128.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0..*</text><text x="415.5" y="162.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">manages</text><text x="20.0" y="796.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Notation:  solid line + hollow triangle = inheritance (generalisation)   |   dashed line + hollow triangle = interface realisation</text><text x="20.0" y="816.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">«abstract» / italics = abstract class or method   |   hollow diamond = aggregation   |   underlined = class-level (static) member   |   - private  + public</text></svg>
