eight="normal" text-anchor="start">+ update_stock(quantity: int): bool</text><text x="468.0" y="349.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ display_information(): None</text><text x="468.0" y="367.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ to_dict(): dict</text><text x="468.0" y="385.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start" font-style="italic">+ «abstract» get_fulfilment_info(): str</text><rect x="1010" y="80" width="361.8" height="102" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><rect x="1010" y="80" width="361.8" height="52" fill="#ffe9a8" stroke="#222" stroke-width="1.4"/><text x="1190.9" y="102.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="middle">«interface»</text><text x="1190.9" y="120.0" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle" font-style="italic">CanBeShipped</text><line x1="1010" y1="132" x2="1371.8" y2="132" stroke="#222" stroke-width="1.4"/><line x1="1010" y1="148" x2="1371.8" y2="148" stroke="#222" stroke-width="1.4"/><text x="1018.0" y="169.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start" font-style="italic">+ «abstract» calculate_shipping_cost(): float</text><rect x="150" y="520" width="505.2" height="192" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><rect x="150" y="520" width="505.2" height="34" fill="#ffe9a8" stroke="#222" stroke-width="1.4"/><text x="402.6" y="542.0" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">DigitalProduct</text><line x1="150" y1="554" x2="655.2" y2="554" stroke="#222" stroke-width="1.4"/><text x="158.0" y="575.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5