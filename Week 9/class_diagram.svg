<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="846" viewBox="0 0 1392 846"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Inventory Management System - UML Class Diagram (Week 9)</text><rect x="20" y="80" width="339.1" height="174" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><rect x="20" y="80" width="339.1" height="34" fill="#ffe9a8" stroke="#222" stroke-width="1.4"/><text x="189.5" y="102.0" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">Inventory</text><line x1="20" y1="114" x2="359.1" y2="114" stroke="#222" stroke-width="1.4"/><text x="28.0" y="135.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">- products: list[Product]</text><line x1="20" y1="148" x2="359.1" y2="148" stroke="#222" stroke-width="1.4"/><text x="28.0" y="169.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ __init__()</text><text x="28.0" y="187.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ add_product(product: Product): bool</text><text x="28.0" y="205.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ search_product(product_id: str): Product</text><text x="28.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ display_all(): None</text><text x="28.0" y="241.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" text-anchor="start">+ to_list(): list[dict]</text><rect x="460" y="80" width="505.2" height="318" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><rect x="460" y="80" width="505.2" height="52" fill="#ffe9a8" stroke="#222" stroke-width="1.4"/><text x="712.6" y="102.0"